<!DOCTYPE html>
<title>Synched fullscreen test: popup</title>
<style>
  .button {
    border: solid 1px grey;
    margin: 5px;
  }
</style>
<body onload="run()">
    <div>
      <b>Popup</b>: After the second click on the opener window,
      click one button below and check the fullscreen status.
    </div>
    <div class="button" id="fullscreener">
      Fullscreen both together, opener first
    </div>
  </div>
</body>
<script>
  function run() {
    document.getElementById("fullscreener").onclick = () => {
      opener.document.body.requestFullscreen();
      document.body.requestFullscreen();
    };
  }
</script>
