<!DOCTYPE html>
<title>Synched fullscreen test</title>
<style>
  div {
    border: solid 1px grey;
    margin: 5px;
    height: 50px;
  }
</style>
<div id="noop">
  Click to do nothing
</div>
<div id="opener">
  Click to open a popup
</div>
<div id="fullscreener0">
  Click to make two fullscreen calls together
</div>
<div id="fullscreener1">
  Click to make two fullscreen calls, this first
</div>
<div id="fullscreener2">
  Click to make two fullscreen calls, opener first
</div>
<script>
  let delay = 100;
  document.getElementById("opener").onclick = () => open(location.href + "?a", "noname");
  document.getElementById("fullscreener0").onclick = () => {
    opener.document.body.requestFullscreen();
    document.body.requestFullscreen();
  };
  document.getElementById("fullscreener1").onclick = () => {
    setTimeout(() => opener.document.body.requestFullscreen(), delay);
    document.body.requestFullscreen();
  };
  document.getElementById("fullscreener2").onclick = () => {
    opener.document.body.requestFullscreen();
    setTimeout(() => document.body.requestFullscreen(), delay);
  };
</script>
