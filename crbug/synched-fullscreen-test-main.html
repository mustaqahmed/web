<!DOCTYPE html>
<title>Synched fullscreen test: minimal</title>
<style>
  .button {
    border: solid 1px grey;
    margin: 5px;
  }
</style>
<body onload="run()">
  <div>
    <b>Main window:</b> Click one button below,
    then come back here and click the same button again.
  </div>
  <div class="button" id="opener">
    Open new or existing popup w/o geom

</body>
<script>

    document.getElementById("opener").onclick =
      () => open(
                  "synched-fullscreen-test-popup.html",
                  "noname_s"
                  /* , "width=300,height=200,top=10,left=10" */
                );
  }
</script>
